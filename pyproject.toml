[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-dry-run-executor"
version = "0.1.0"
description = "Pharos SkillEngine Dry-Run Transaction Simulator & Execution Gate"
readme = "README.md"
authors = [{ name = "JimmyOgb", email = "jimmy@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[project.scripts]
pharos-dry-run = "executor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"
